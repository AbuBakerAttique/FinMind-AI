services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: finmind-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    volumes:
      - finmind_qdrant_data:/qdrant/storage

volumes:
  finmind_qdrant_data:
    external: true
    name: finmind_qdrant_data